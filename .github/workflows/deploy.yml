# Deploys getmaxsolutions.com (frontend/) to Cloudflare Workers.
# Push to the production branch → static Next export + lead worker go live.
# Needs repo secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token).
name: Deploy to Cloudflare

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-solutions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4.151.2 deploy
